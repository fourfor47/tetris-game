# 游戏配置
game_config:
  name: "我的游戏"
  engine: "phaser"  # phaser, unity, godot
  version: "0.1.0"
  target_fps: 60
  resolution:
    width: 800
    height: 600

# 自动化规则
automation_rules:
  bugs_first: true  # Bug 优先修复
  auto_commit: true  # 自动提交
  auto_test: true   # 自动测试
  max_tasks_per_session: 3  # 每次会话最多完成的任务数
